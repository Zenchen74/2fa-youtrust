# config/services.yaml
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $youTrustApiKey: '%env(YOU_TRUST_API_KEY)%'
            string $youTrustBaseUrl: '%env(YOU_TRUST_BASE_URL)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
